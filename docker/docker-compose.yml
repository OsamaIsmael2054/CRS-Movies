name: MoviesCRS
services:
  postgres:
    image: postgres:18-alpine
    container_name: movies_crs_postgres
    restart: unless-stopped
    env_file:
      - ./env/.env.postgres
    environment:
      PGDATA: /var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  crs:
    build:
      context: ..
      dockerfile: docker/crs/Dockerfile
    container_name: movies_crs_app
    profiles: ["app"]
    restart: unless-stopped
    env_file:
      - ./env/.env.postgres
      - ./env/.env.app
    ports:
      - "${APP_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
